# Credential references only. Store values with `keyenv set ENV_NAME`.
[keyenv]
version = 1

[secrets.DATABASE_URL]
account = "sigmaevolve/DATABASE_URL"
required = true

[secrets.OPENROUTER_API_KEY]
account = "sigmaevolve/OPENROUTER_API_KEY"
required = true

[secrets.SENTRY_AUTH_TOKEN]
account = "sigmaevolve/SENTRY_AUTH_TOKEN"
required = true

[secrets.SENTRY_SMOKE_TOKEN]
account = "sigmaevolve/SENTRY_SMOKE_TOKEN"
required = true

[secrets.SIGMAEVOLVE_DATABASE_URL]
account = "sigmaevolve/SIGMAEVOLVE_DATABASE_URL"
required = true

[secrets.WANDB_API_KEY]
account = "sigmaevolve/WANDB_API_KEY"
required = true
