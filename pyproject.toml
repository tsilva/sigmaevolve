[project]
name = "sigmaevolve"
version = "0.1.0"
description = "Evolutionary training harness for immutable classification datasets."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "psycopg[binary]>=3.3.4",
  "sqlalchemy>=2.0",
  "torch>=2.13.0",
  "wandb>=0.28.1",
]

[project.scripts]
sigmaevolve = "sigmaevolve.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.4",
]
datasets = [
  "torchvision>=0.28.0",
]
modal = [
  "modal>=1.3.5",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sigmaevolve*"]

[tool.setuptools.package-data]
sigmaevolve = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["sigmaevolve", "tests"]
target-version = "py311"

[tool.ruff.lint]
# Keep the repository's intended rule set stable across Ruff default changes.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "PLC0415",
  "RET505",
  "RET506",
  "RET507",
  "RET508",
  "SIM201",
  "SIM202",
  "SIM208",
]

[tool.ruff.lint.isort]
known-first-party = ["sigmaevolve"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "aiohttp>=3.14.3",
  "cbor2>=5.9.0",
  "click>=8.3.3",
  "gitpython>=3.1.58",
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "h2>=4.4.1",
  "idna>=3.15",
  "pillow>=12.3.0",
  "pygments>=2.20.0",
  "requests>=2.33.0",
  "setuptools>=83.0.0",
  "urllib3>=2.7.0",
]
