[project]
name = "sigmaevolve"
version = "0.1.0"
description = "Evolutionary training harness for immutable classification datasets."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "psycopg[binary]>=3.1",
  "sqlalchemy>=2.0",
  "torch>=2.13.0",
  "wandb>=0.19",
]

[project.scripts]
sigmaevolve = "sigmaevolve.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.4",
]
datasets = [
  "torchvision>=0.18",
]
modal = [
  "modal>=1.3.5",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sigmaevolve*"]

[tool.setuptools.package-data]
sigmaevolve = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["sigmaevolve", "tests"]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
  "E4",
  "I",
  "PLC0415",
  "RET505",
  "RET506",
  "RET507",
  "RET508",
  "SIM201",
  "SIM202",
  "SIM208",
]

[tool.ruff.lint.isort]
known-first-party = ["sigmaevolve"]
