name: Production delivery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage_prebuilt:
        description: Stage and verify a GitHub-built artifact without changing production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@a20dac1368cedf94bf81e0af5eb38f844a924240
    with:
      sync_only: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  publish:
    needs: deliver
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.action == 'completed' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.repository.id == github.repository_id &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    uses: tsilva/.github/.github/workflows/vercel-prebuilt.yml@a20dac1368cedf94bf81e0af5eb38f844a924240
    with:
      project_id: prj_Kn7VMXsapAZYHNgxkmRhb8pQhjOI
      project_name: sigmaevolve
      root_directory: dashboard
      production_domains: '["sigmaevolve.tsilva.eu","sigmaevolve-mhjf.vercel.app"]'
      public_environment: '["NEXT_PUBLIC_SENTRY_DSN","SENTRY_ORG","SENTRY_PROJECT"]'
      source_maps: true
      promote: ${{ !inputs.stage_prebuilt }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
