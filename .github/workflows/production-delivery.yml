name: Production delivery

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/production-delivery.yml
  workflow_dispatch:
    inputs:
      stage_prebuilt:
        description: Stage and verify a GitHub-built artifact without changing production domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@48a4449de4ac5f4d5e14343f70fe5fc57bc2cd74
    with:
      sync_only: ${{ inputs.stage_prebuilt }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  stage_prebuilt:
    needs: deliver
    if: github.ref == 'refs/heads/main' && inputs.stage_prebuilt
    uses: tsilva/.github/.github/workflows/vercel-prebuilt.yml@09a8cf02142b4dfbf661c3ea4ffb783feaf6a374
    with:
      project_id: prj_Kn7VMXsapAZYHNgxkmRhb8pQhjOI
      project_name: sigmaevolve
      root_directory: dashboard
      production_domains: '["sigmaevolve.tsilva.eu","sigmaevolve-mhjf.vercel.app"]'
      public_environment: '["NEXT_PUBLIC_SENTRY_DSN","SENTRY_ORG","SENTRY_PROJECT"]'
      source_maps: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
