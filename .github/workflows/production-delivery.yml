name: Production delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-secret-delivery
  cancel-in-progress: false

jobs:
  secrets:
    name: Check committed secrets before production delivery
    uses: ./.github/workflows/secret-scanning.yml

  deliver:
    needs: secrets
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: tsilva/.github/.github/workflows/production-delivery.yml@139f161ff155fef90e1a01fcfeccb45c5a3925a7
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
